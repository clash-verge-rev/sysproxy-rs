name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            backend: privileged-macos
          - os: ubuntu-latest
            backend: linux
          - os: windows-latest
            backend: windows
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt install -y gsettings-desktop-schemas

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@ce325b60658c1b38465c06cc965b79baf32c1e72

      - name: Check selected backend without default features
        run: cargo check --no-default-features --features "${{ matrix.backend }}"

      - name: Check all features
        run: cargo check --all-features --lib --tests

      - name: Run library tests
        run: cargo test --all-features --lib -- --nocapture

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
